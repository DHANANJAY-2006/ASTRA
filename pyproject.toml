[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-forensics"
version = "1.0.0"
description = "Project ASTRA: Darknet Threat Actor De-Anonymization Forensic Tool (SIH 2026 Problem 26151)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Team BISHOP", email = "bishop.sih2026@astra.local" }
]
keywords = [
    "darknet", "threat-intelligence", "cyber-forensics",
    "de-anonymization", "tor", "blockchain", "stylometry", "sih2026"
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "httpx[socks]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
astra = "astra.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["astra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
